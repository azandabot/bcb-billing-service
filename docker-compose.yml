services:
  billing:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: UTC
      TRANSACTION_FEE_GBP: '0.30'
    ports:
      - '3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
